<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajouter un article - Fateam Shop</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#fff1f7,#eee4ff);
color:#35283b;
padding:20px;
}

.container{
max-width:650px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 8px 30px #8b5cf630;
}

h1{
text-align:center;
color:#934c9d;
}

label{
display:block;
font-weight:bold;
margin-top:18px;
margin-bottom:7px;
}

input,select{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#d94f9d,#8b5cf6);
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.result{
margin-top:25px;
}

textarea{
width:100%;
height:180px;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
font-family:monospace;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#934c9d;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>➕ Ajouter un article</h1>
<label>Photo du produit</label>
<input id="photo" type="file" accept="image/*">
<label>Nom du produit</label>
<input id="nom" type="text" placeholder="Exemple : Kit sourcils & cils">

<label>Prix</label>
<input id="prix" type="number" placeholder="Exemple : 2500">

<label>Nom de l'image</label>
<input id="image" type="text" placeholder="Exemple : nouveau-produit.jpeg">

<label>Catégorie</label>
<select id="categorie">
<option>Beauté</option>
<option>Cheveux</option>
<option>Couture</option>
<option>Nouveautés</option>
</select>

<button onclick="generer()">Générer le produit</button>

<div class="result" id="resultat"></div>

<a class="back" href="index.html">← Retour à Fateam Shop</a>

</div>

<script>

function generer(){

const nom=document.getElementById("nom").value;
const prix=document.getElementById("prix").value;
const image=document.getElementById("image").value;

if(!nom || !prix || !image){

alert("Veuillez remplir le nom, le prix et le nom de l'image.");

return;
}

const code=`<article class="card">
<img src="${image}">
<div class="info">
<h3>${nom}</h3>
<div class="price">${Number(prix).toLocaleString("fr-FR")} FCFA</div>
<button onclick="commander('${nom}')">Commander</button>
</div>
</article>`;

document.getElementById("resultat").innerHTML=`

<h3>✅ Produit généré</h3>

<p>Copiez ce code et ajoutez-le dans la section <b>Nos produits</b> de votre page index.html :</p>

<textarea id="code">${code}</textarea>

<button onclick="copier()">📋 Copier le code</button>

`;

}

function copier(){

const textarea=document.getElementById("code");

textarea.select();

navigator.clipboard.writeText(textarea.value);

alert("✅ Code copié !");

}

</script>

</body>
</html>
