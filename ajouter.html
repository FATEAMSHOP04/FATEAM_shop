<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ajouter un article - Fateam Shop</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #f8d7e8, #d9c2f0);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 650px;
    margin: 20px auto;
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #9b4d96;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

h1 {
    text-align: center;
    color: #7b3f78;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 18px;
    margin-bottom: 7px;
    color: #444;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #b65bb0;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

.photo-box {
    border: 2px dashed #c47bc0;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    background: #fff8fd;
}

.photo-box input {
    border: none;
}

#preview {
    display: none;
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 15px;
    margin: 15px auto 0;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 30px;
}

button {
    flex: 1;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.publish {
    background: linear-gradient(135deg, #a84ca4, #d66bbd);
    color: white;
}

.back {
    background: #eee;
    color: #555;
}

.message {
    text-align: center;
    margin-top: 20px;
    font-weight: bold;
    color: #8b4787;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">Fateam Shop</div>
    <div class="subtitle">Ma boutique en ligne</div>

    <h1>➕ Ajouter un article</h1>

    <form id="productForm">

        <label>📷 Photo du produit</label>

        <div class="photo-box">
            <div>Choisissez une photo de votre produit</div>
            <input
                type="file"
                id="photo"
                accept="image/*"
                required
            >
            <img id="preview" alt="Aperçu du produit">
        </div>

        <label for="name">🏷️ Nom de l'article</label>
        <input
            type="text"
            id="name"
            placeholder="Exemple : Huile de coco"
            required
        >

        <label for="price">💰 Prix (FCFA)</label>
        <input
            type="number"
            id="price"
            placeholder="Exemple : 2500"
            min="0"
            required
        >

        <label for="category">🗂️ Catégorie</label>

        <select id="category" required>
            <option value="">Choisir une catégorie</option>
            <option>Beauté</option>
            <option>Cheveux</option>
            <option>Couture</option>
            <option>Maison</option>
            <option>Nouveautés</option>
            <option>Autres</option>
        </select>

        <label for="description">📝 Description</label>

        <textarea
            id="description"
            placeholder="Décrivez votre produit..."
            required
        ></textarea>

        <label for="stock">📦 Quantité disponible</label>

        <input
            type="number"
            id="stock"
            placeholder="Exemple : 10"
            min="0"
            required
        >

        <div class="buttons">

            <button
                type="button"
                class="back"
                onclick="window.location.href='index.html'"
            >
                ← Retour
            </button>

            <button
                type="submit"
                class="publish"
            >
                Publier l'article
            </button>

        </div>

        <div id="message" class="message"></div>

    </form>

</div>

<script>

const photo = document.getElementById("photo");
const preview = document.getElementById("preview");
const form = document.getElementById("productForm");
const message = document.getElementById("message");

photo.addEventListener("change", function() {

    const file = this.files[0];

    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    }

});

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const price = document.getElementById("price").value;

    message.textContent =
        "✅ Article « " + name +
        " » prêt à être publié au prix de " +
        price + " FCFA.";

});

</script>

</body>
</html>
