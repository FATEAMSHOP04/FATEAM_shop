<html lang="fr">
<head>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f8c8dc, #c8a2c8);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      color: #8e4585;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #444;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      margin-top: 25px;
      border-radius: 12px;
      background: #8e4585;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .retour {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #8e4585;
      text-decoration: none;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>➕ Ajouter un article</h1>

    <form id="productForm">

      <input

        id="name"

      >

      <input
        type="number"
        id="price"
        placeholder="Ex : 2500"

        required
      >

      <label for="category">Catégorie</label>

        <option value="Couture">Couture</option>
        <option value="Maison">Maison</option>
        <option value="Nouveautés">Nouveautés</option>
      </select>

      <label for="description">Description</label>
      <textarea
        id="description"
        placeholder="Décris ton produit..."
        required
      ></textarea>

      <label for="stock">Stock disponible</label>
      <input
        type="number"
        id="stock"
        placeholder="Ex : 10"
        min="0"
        value="1"
        required
      >

      <button type="submit" id="publishButton">
        Publier l'article
      </button>

    </form>

    <div id="message"></div>

      ← Retour à la boutique
